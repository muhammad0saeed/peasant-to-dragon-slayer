'use strict';
/* =====================================================================

const W = 480, H = 270, TS = 16;
const cvs = document.getElementById('game');
const ctx = cvs.getContext('2d');
ctx.imageSmoothingEnabled = false;

function resize() {
  let s = Math.min(innerWidth / W, innerHeight / H);
  s = s >= 1 ? Math.floor(s) : s;
  cvs.style.width = W * s + 'px';
  cvs.style.height = H * s + 'px';
  cvs.style.left = Math.floor((innerWidth - W * s) / 2) + 'px';
  cvs.style.top = Math.floor((innerHeight - H * s) / 2) + 'px';
}
addEventListener('resize', resize);
resize();

/* ------------------------------------------------------------------ */
/* Input                                                               */
/* ------------------------------------------------------------------ */
const keys = {}, pressed = {};
const KEYMAP = {
  ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right',
  ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down',
  KeyZ: 'jump', Space: 'jump', KeyK: 'jump',
  KeyX: 'attack', KeyJ: 'attack',
  ShiftLeft: 'run', ShiftRight: 'run', KeyC: 'run', KeyL: 'run',
  Enter: 'start', KeyP: 'pause', Escape: 'pause', KeyM: 'mute'
};
addEventListener('keydown', e => {
  const a = KEYMAP[e.code];
  if (!a) return;
  e.preventDefault();
  if (!keys[a]) pressed[a] = true;
  keys[a] = true;
  Sound.unlock();
});
addEventListener('keyup', e => {
  const a = KEYMAP[e.code];
  if (!a) return;
  e.preventDefault();
  keys[a] = false;
});
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
function clearPressed() { for (const k in pressed) pressed[k] = false; }

const padState = {};
function setPad(a, v) {
  if (v && !padState[a]) { pressed[a] = true; keys[a] = true; }
  else if (!v && padState[a]) keys[a] = false;
  padState[a] = v;
}
function pollPad() {
  const pads = navigator.getGamepads ? navigator.getGamepads() : null;
  const gp = pads && pads[0];
  if (!gp) return;
  const b = i => !!(gp.buttons[i] && gp.buttons[i].pressed);
  const ax = gp.axes[0] || 0, ay = gp.axes[1] || 0;
  setPad('left', ax < -0.4 || b(14));
  setPad('right', ax > 0.4 || b(15));
  setPad('up', ay < -0.5 || b(12));
  setPad('down', ay > 0.5 || b(13));
  setPad('jump', b(0));
  setPad('attack', b(2));
  setPad('run', b(1) || b(5) || b(7));
  setPad('start', b(9));
}
const anyAdvance = () => pressed.jump || pressed.attack || pressed.start;

/* ------------------------------------------------------------------ */
/* Sound: effects and music synthesised with Web Audio                 */
/* ------------------------------------------------------------------ */
const Sound = (() => {
  let ac = null, master, sfxBus, musicBus, muted = false;
  function unlock() {
    if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
    try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
    master = ac.createGain(); master.gain.value = 0.5; master.connect(ac.destination);
    sfxBus = ac.createGain(); sfxBus.gain.value = 0.6; sfxBus.connect(master);
    musicBus = ac.createGain(); musicBus.gain.value = 0.2; musicBus.connect(master);
  }
  function tone(freq, dur, type = 'square', vol = 0.3, slide = 1, when = 0, bus) {
    if (!ac) return;
    const t = ac.currentTime + when;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (slide !== 1) o.frequency.exponentialRampToValueAtTime(Math.max(20, freq * slide), t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(bus || sfxBus);
    o.start(t); o.stop(t + dur + 0.03);
  }
  function noise(dur, vol = 0.3, when = 0, hp = 800) {
    if (!ac) return;
    const t = ac.currentTime + when;
    const len = Math.max(1, Math.floor(ac.sampleRate * dur));
    const buf = ac.createBuffer(1, len, ac.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const s = ac.createBufferSource(); s.buffer = buf;
    const f = ac.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp;
    const g = ac.createGain(); g.gain.value = vol;
    s.connect(f); f.connect(g); g.connect(sfxBus);
    s.start(t);
  }
  const seq = (notes, step, type, vol) => notes.forEach((f, i) => tone(f, step * 1.6, type, vol, 1, i * step));
  const sfx = {
    jump: () => tone(220, 0.18, 'square', 0.16, 2.2),
    coin: () => { tone(988, 0.07, 'square', 0.14); tone(1319, 0.2, 'square', 0.14, 1, 0.07); },
    stomp: () => { tone(200, 0.13, 'square', 0.25, 0.4); noise(0.08, 0.2, 0, 1500); },
    hit: () => { noise(0.1, 0.3, 0, 2000); tone(240, 0.09, 'sawtooth', 0.15, 0.5); },
    swing: () => noise(0.1, 0.12, 0, 3000),
    hurt: () => { tone(420, 0.28, 'sawtooth', 0.2, 0.3); noise(0.15, 0.2, 0, 2500); },
    chest: () => seq([523, 659, 784, 1047, 1319], 0.08, 'square', 0.14),
    potion: () => seq([392, 523, 659, 784], 0.07, 'triangle', 0.25),
    gem: () => seq([1047, 1319, 1568, 2093], 0.05, 'square', 0.11),
    shard: () => seq([659, 988, 1319, 1976, 2637], 0.07, 'triangle', 0.22),
    die: () => seq([392, 330, 262, 196, 147], 0.14, 'square', 0.18),
    bounce: () => tone(140, 0.3, 'triangle', 0.35, 3.2),
    blip: () => tone(700, 0.025, 'square', 0.04),
    check: () => seq([659, 784, 988, 1319], 0.07, 'square', 0.13),
    clear: () => seq([523, 659, 784, 1047, 784, 1047, 1319], 0.12, 'square', 0.15),
    smash: () => { noise(0.22, 0.3, 0, 500); tone(110, 0.15, 'square', 0.15, 0.5); },
    life: () => seq([523, 784, 1047, 1319, 1568, 2093], 0.06, 'square', 0.13),
    select: () => tone(880, 0.08, 'square', 0.1),
    notice: () => tone(1200, 0.06, 'square', 0.08),
    tired: () => { tone(330, 0.18, 'triangle', 0.2, 0.8); tone(247, 0.25, 'triangle', 0.2, 0.8, 0.16); },
    cluck: () => { tone(950, 0.05, 'square', 0.06, 0.7); tone(720, 0.07, 'square', 0.05, 0.8, 0.08); },
    step: () => tone(90, 0.03, 'triangle', 0.08)

  const N = m => 440 * Math.pow(2, (m - 69) / 12);
  const LEAD = [69,72,76,72,74,76,79,76, 81,79,76,74,76,0,72,74, 72,71,69,71,72,76,74,72, 71,0,67,71,69,0,0,0,
                69,72,76,72,74,76,79,81, 83,81,79,76,74,76,79,0, 81,79,76,74,72,74,76,72, 69,0,64,67,69,0,0,0];
  const BASS = [45,52,45,52, 43,50,43,50, 41,48,41,48, 40,47,40,47, 45,52,45,52, 43,50,43,50, 41,48,41,48, 40,47,45,45];
  const STEP = 0.21;
  let playing = false, nextT = 0, idx = 0, timer = null;
  function schedule() {
    if (!ac || !playing) return;
    while (nextT < ac.currentTime + 0.25) {
      const i = idx % LEAD.length;
      const when = nextT - ac.currentTime;
      if (LEAD[i]) tone(N(LEAD[i]), STEP * 0.95, 'square', 0.09, 1, when, musicBus);
      if (i % 2 === 0) tone(N(BASS[(i / 2) % BASS.length]), STEP * 1.8, 'triangle', 0.32, 1, when, musicBus);
      if (i % 4 === 2) tone(90, 0.05, 'square', 0.05, 0.5, when, musicBus);
      nextT += STEP; idx++;
    }
  }
  function play() {
    if (playing) return;
    unlock();
    if (!ac) return;
    playing = true; idx = 0; nextT = ac.currentTime + 0.1;
    timer = setInterval(schedule, 40);
  }
  function stop() { playing = false; clearInterval(timer); }
  function toggleMute() { muted = !muted; if (master) master.gain.value = muted ? 0 : 0.5; return muted; }
  return { unlock, sfx, play, stop, toggleMute, get muted() { return muted; } };
})();
const sfx = Sound.sfx;

/* ------------------------------------------------------------------ */
/* Pixel helpers                                                       */
/* ------------------------------------------------------------------ */
function px(g, x, y, w, h, c) { g.fillStyle = c; g.fillRect(Math.round(x), Math.round(y), w, h); }
function line(g, x0, y0, x1, y1, c, t = 1) {
  x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
  const dx = Math.abs(x1 - x0), sx = x0 < x1 ? 1 : -1, dy = -Math.abs(y1 - y0), sy = y0 < y1 ? 1 : -1;
  let err = dx + dy;
  const o = Math.floor(t / 2);
  g.fillStyle = c;
  for (let n = 0; n < 600; n++) {
    g.fillRect(x0 - o, y0 - o, t, t);
    if (x0 === x1 && y0 === y1) break;
    const e2 = 2 * err;
    if (e2 >= dy) { err += dy; x0 += sx; }
    if (e2 <= dx) { err += dx; y0 += sy; }
  }
}
function disc(g, cx, cy, r, c) {
  g.fillStyle = c;
  for (let dy = -r; dy <= r; dy++) {
    const w = Math.floor(Math.sqrt(r * r - dy * dy));
    g.fillRect(Math.round(cx - w), Math.round(cy + dy), 2 * w + 1, 1);
  }
}
const _shade = new Map();
function dk(hex, f = 0.72) {
  const k = hex + f;
  if (_shade.has(k)) return _shade.get(k);
  const n = parseInt(hex.slice(1), 16);
  const ch = v => Math.max(0, Math.min(255, Math.round(v * f)));
  const s = '#' + ((1 << 24) | (ch((n >> 16) & 255) << 16) | (ch((n >> 8) & 255) << 8) | ch(n & 255)).toString(16).slice(1);
  _shade.set(k, s);
  return s;
}
function makeCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d');
  g.imageSmoothingEnabled = false;
  return [c, g];
}
function rng(seed) {
  let s = (seed * 2654435761) >>> 0 || 1;
  return () => { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; };
}
const hash = (x, y) => (((x * 73856093) ^ (y * 19349663)) >>> 0);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

const GLYPHS = {};

const glyphCache = new Map();
function glyphCanvas(ch, color) {
  const key = ch + color;
  let c = glyphCache.get(key);
  if (c) return c;
  const rows = GLYPHS[ch];
  const [cv, g] = makeCanvas(5, 7);
  if (rows) {
    g.fillStyle = color;
    for (let y = 0; y < 7; y++) for (let x = 0; x < 5; x++) if (rows[y][x] === '#') g.fillRect(x, y, 1, 1);
  }
  glyphCache.set(key, cv);
  return cv;
}
function textWidth(s, scale = 1) { return s.length * 6 * scale - scale; }
function drawText(s, x, y, color = '#fff', scale = 1, align = 'left', shadow = null) {
  s = String(s).toUpperCase();
  const w = textWidth(s, scale);
  const sx = align === 'center' ? Math.round(x - w / 2) : align === 'right' ? Math.round(x - w) : Math.round(x);
  if (shadow) drawText(s, sx + scale, y + scale, shadow, scale, 'left', null);
  for (let i = 0; i < s.length; i++) {

  const words = text.split(' '), out = [];

    if ((lineStr + ' ' + w).trim().length > maxChars) { out.push(lineStr); lineStr = w; }

  if (lineStr) out.push(lineStr);
  return out;

function drawFlame(x, y, s, t, seed = 0) {
  const n = 5;
  for (let i = 0; i < n; i++) {
    const ox = (i - (n - 1) / 2) * s * 0.35;
    const h = s * (0.7 + 0.45 * Math.sin(t * 11 + i * 1.9 + seed));
    const w = Math.max(2, Math.round(s * 0.45));
    px(ctx, x + ox - w / 2, y - h, w, h, '#d8402a');
    px(ctx, x + ox - w / 2 + 1, y - h * 0.7, Math.max(1, w - 2), h * 0.7, '#f08a2a');
    px(ctx, x + ox - 0.5, y - h * 0.4, Math.max(1, w - 3), h * 0.4, '#ffd84a');
  }
}

    const age = ((t * 0.3 + k / 6 + seed * 0.13) % 1);
    const sx = x + Math.sin(age * 5 + k + seed) * 5 * age * scale + age * 12 * scale;
    const sy = y - age * 80 * scale;
    const r = Math.round((2 + age * 8) * scale);
    ctx.fillStyle = `rgba(80,72,70,${(0.45 * (1 - age)).toFixed(3)})`;
    ctx.fillRect(Math.round(sx - r), Math.round(sy - r), r * 2, r * 2);
  }
}

const GRAV = 1100, MAX_FALL = 420, JUMP_V = -400, WALK_MAX = 80, RUN_MAX = 130, TIRED_MAX = 62, HAY_V = -560;
const STAMINA_MAX = 100, STAMINA_DRAIN = 30, STAMINA_REGEN = 26, STAMINA_RECOVER = 40;
function isOneWayAt(c, r, o) {
  const t = getT(c, r);
  if (t === T.PLANK) return true;
  if (t === T.LADDER && getT(c, r - 1) !== T.LADDER && !o.climbing) return true;
  return false;
}
function moveX(o, dx) {
  o.hitWall = 0;
  o.x += dx;
  const top = Math.floor(o.y / TS), bot = Math.floor((o.y + o.h - 1) / TS);
  if (dx > 0) {
    const c = Math.floor((o.x + o.w - 1) / TS);
    for (let r = top; r <= bot; r++) if (isSolidT(getT(c, r))) { o.x = c * TS - o.w; o.vx = 0; o.hitWall = 1; break; }
  } else if (dx < 0) {
    const c = Math.floor(o.x / TS);
    for (let r = top; r <= bot; r++) if (isSolidT(getT(c, r))) { o.x = (c + 1) * TS; o.vx = 0; o.hitWall = -1; break; }
  }
}
function moveY(o, dy) {
  const prevBottom = o.y + o.h;
  o.y += dy;
  o.onGround = false;
  const l = Math.floor(o.x / TS), rr = Math.floor((o.x + o.w - 1) / TS);
  if (dy > 0) {
    const r = Math.floor((o.y + o.h) / TS);
    for (let c = l; c <= rr; c++) {
      const t = getT(c, r);
      if (isSolidT(t) || (isOneWayAt(c, r, o) && prevBottom <= r * TS + 0.5)) {
        o.y = r * TS - o.h; o.vy = 0; o.onGround = true; o.groundTile = t; o.groundCol = c;
        break;
      }
    }
  } else if (dy < 0) {
    const r = Math.floor(o.y / TS);
    for (let c = l; c <= rr; c++) if (isSolidT(getT(c, r))) { o.y = (r + 1) * TS; o.vy = 0; break; }
  }
}
function groundAhead(o, dir) {
  const c = Math.floor((dir > 0 ? o.x + o.w + 1 : o.x - 1) / TS);
  const r = Math.floor((o.y + o.h + 1) / TS);
  return isSolidT(getT(c, r)) || isOneWayAt(c, r, o);
}

  if (p.tier < G.maxTier && G.coins >= 30) {
    say([{ who: 'HOBB', look: 'hobb', text: 'THIRTY COINS. THERE - GOOD AS NEW. PLEASURE DOING BUSINESS.' }], () => {
      G.coins -= 30; setTier(p.tier + 1); sfx.potion();
      burst(p.x + p.w / 2, p.y + 14, 14, ['#ff6a7a', '#ffd0d8', '#ffffff'], 70, 0, 0.6);
    });
  } else if (p.tier < G.maxTier) say([{ who: 'HOBB', look: 'hobb', text: 'THIRTY COINS A POTION. DRAGON OR NO DRAGON.' }]);
  else say([{ who: 'HOBB', look: 'hobb', text: "YOU'RE IN ONE PIECE. COME BACK WHEN YOU'RE NOT. THIRTY COINS A POTION." }]);
}

/* ------------------------------------------------------------------ */
/* Update: player                                                      */
/* ------------------------------------------------------------------ */
function updatePlayer(dt) {
  const p = player;
  p.animT += dt;
  const ease = Math.min(1, dt * 11);
  p.sqx += (1 - p.sqx) * ease; p.sqy += (1 - p.sqy) * ease;
  if (p.flash > 0) p.flash -= dt;
  if (p.dead) {
    p.deadT += dt;
    if (p.deadT > 0.4) { p.vy = Math.min(p.vy + GRAV * dt, MAX_FALL); p.y += p.vy * dt; p.rot += dt * 6; }
    if (p.deadT > 2.4) {
      if (G.lives <= 0) { state = 'gameover'; G.overT = 0; return; }
      spawnEnemies(); barrels = [];
      spawnPlayer(G.respawn.x, G.respawn.y, 0);
      cam.x = clamp(player.x - W * 0.4, 0, LEVEL_W - W);
      Sound.play();
    }
    return;
  }
  if (G.clearT >= 0) {
    p.vx *= 0.85; p.attacking = false;
    p.vy = Math.min(p.vy + GRAV * dt, MAX_FALL);
    moveX(p, p.vx * dt); moveY(p, p.vy * dt);
    p.anim = 'idle';
    return;
  }
  if (p.invuln > 0) p.invuln -= dt;
  if (p.hurtT > 0) p.hurtT -= dt;
  if (p.attackCd > 0) p.attackCd -= dt;

  const L = keys.left, R = keys.right, ctrl = p.hurtT <= 0;
  p.coyote = p.onGround ? 0.1 : p.coyote - dt;
  if (pressed.jump) p.buffer = 0.12; else p.buffer -= dt;

  const cx = Math.floor((p.x + p.w / 2) / TS);
  const bodyOnLadder = () => {
    const t0 = Math.floor(p.y / TS), t1 = Math.floor((p.y + p.h - 1) / TS);
    for (let r = t0; r <= t1; r++) if (getT(cx, r) === T.LADDER) return true;
    return false;
  };
  const ladderUnderFeet = getT(cx, Math.floor((p.y + p.h) / TS)) === T.LADDER;

  if (!p.climbing && ctrl && !p.attacking) {
    if ((keys.up && bodyOnLadder()) || (keys.down && p.onGround && ladderUnderFeet)) {
      if (p.crouching) { p.crouching = false; p.y -= 12; p.h = 38; }
      p.climbing = true; p.vx = 0; p.vy = 0;
      p.x = cx * TS + TS / 2 - p.w / 2;
      if (keys.down && ladderUnderFeet && p.onGround) p.y += 3;
    }
  }
  if (p.climbing) {
    p.anim = 'climb';
    p.vy = keys.up ? -60 : keys.down ? 60 : 0;
    if (p.vy !== 0) p.climbAnim += dt;
    moveY(p, p.vy * dt);
    const footRow = Math.floor((p.y + p.h - 1) / TS);
    if (keys.up && getT(cx, footRow) !== T.LADDER && getT(cx, footRow + 1) === T.LADDER) {
      p.y = (footRow + 1) * TS - p.h; p.climbing = false; p.onGround = true; p.vy = 0;
    } else if (!bodyOnLadder()) p.climbing = false;
    else if (p.onGround && keys.down) p.climbing = false;
    if (p.climbing && pressed.jump) {
      p.climbing = false; p.vy = -280; p.jumping = true; p.buffer = 0;
      if (L) p.vx = -60; if (R) p.vx = 60;
      sfx.jump();
    }
    return;
  }

  const wantCrouch = keys.down && p.onGround && ctrl;
  if (wantCrouch && !p.crouching) { p.crouching = true; p.y += 12; p.h = 26; }
  else if (!wantCrouch && p.crouching) {
    const l = Math.floor(p.x / TS), rr = Math.floor((p.x + p.w - 1) / TS), r = Math.floor((p.y - 12) / TS);
    let blocked = false;
    for (let c = l; c <= rr; c++) if (isSolidT(getT(c, r))) blocked = true;
    if (!blocked) { p.crouching = false; p.y -= 12; p.h = 38; }
  }

  const dir = ctrl && !p.crouching ? (R ? 1 : 0) - (L ? 1 : 0) : 0;
  // Running: decided on the ground, kept through the air so running jumps carry further
  if (p.onGround) p.runMode = !!(keys.run && dir && !p.exhausted && !p.attacking && p.stamina > 0);
  const maxV = p.runMode ? RUN_MAX : p.exhausted ? TIRED_MAX : WALK_MAX;
  const accel = p.onGround ? (p.runMode ? 640 : 520) : 420;
  if (dir) {
    if (Math.sign(p.vx) === -dir && p.onGround) p.vx += dir * 900 * dt; // skid when turning
    if (Math.sign(p.vx) !== dir || Math.abs(p.vx) < maxV) {
      p.vx += dir * accel * dt;
      if (Math.sign(p.vx) === dir && Math.abs(p.vx) > maxV) p.vx = dir * maxV;
    } else if (Math.abs(p.vx) > maxV) p.vx = Math.sign(p.vx) * Math.max(maxV, Math.abs(p.vx) - 600 * dt);
    if (!p.attacking) p.facing = dir;
  } else {
    const dec = (p.onGround ? 700 : 200) * dt;
    p.vx = Math.abs(p.vx) <= dec ? 0 : p.vx - Math.sign(p.vx) * dec;
  }
  if (p.attacking && p.onGround) p.vx *= 0.8;

  if (p.buffer > 0 && p.coyote > 0 && ctrl) {
    if (p.crouching) { p.crouching = false; p.y -= 12; p.h = 38; }
    p.vy = JUMP_V; p.buffer = 0; p.coyote = 0; p.jumping = true;
    p.sqx = 0.86; p.sqy = 1.14;
    sfx.jump();
    dust(p.x + p.w / 2, p.y + p.h, 4);
  }
  if (p.jumping && !keys.jump && p.vy < -150) p.vy = -150;
  p.vy = Math.min(p.vy + GRAV * dt, MAX_FALL);

  p.wasGround = p.onGround;
  moveX(p, p.vx * dt);
  moveY(p, p.vy * dt);
  if (p.onGround && !p.wasGround) {
    p.jumping = false;
    dust(p.x + p.w / 2, p.y + p.h, 5);
    p.sqx = 1.18; p.sqy = 0.84;
    if (p.groundTile === T.HAY) {
      p.vy = HAY_V; p.onGround = false;
      p.sqx = 0.8; p.sqy = 1.22;
      hayBounce.set(p.groundCol, 0.2);
      sfx.bounce();
      burst(p.x + p.w / 2, p.y + p.h, 10, ['#f8e49a', '#e3c35a'], 60, 200, 0.6, 1);
    } else sfx.step();
  }

  if (pressed.attack && !p.attacking && p.attackCd <= 0 && ctrl) {
    p.attacking = true; p.attackT = 0; p.hitSet = new Set();
    sfx.swing();
  }
  if (p.attacking) {
    p.attackT += dt;
    if (p.attackT >= ATTACK_DUR) { p.attacking = false; p.attackCd = 0.1; }
  }

  if (p.y > LEVEL_H + 24) { p.y = LEVEL_H + 24; killPlayer(); p.vy = -380; return; }

  // Stamina
  const sprinting = p.runMode && p.onGround && Math.abs(p.vx) > WALK_MAX * 0.95;
  if (sprinting) {
    p.stamina -= STAMINA_DRAIN * dt; p.regenDelay = 0.6;
    if (p.stamina <= 0) {
      p.stamina = 0; p.exhausted = true; p.runMode = false;
      sfx.tired();
      popups.push({ x: p.x + p.w / 2, y: p.y - 8, text: 'OUT OF BREATH!', t: 0, color: '#ffb36a' });
    }
  } else {
    if (p.regenDelay > 0) p.regenDelay -= dt;
    else p.stamina = Math.min(STAMINA_MAX, p.stamina + (p.exhausted ? STAMINA_REGEN * 0.7 : STAMINA_REGEN) * dt);
    if (p.exhausted && p.stamina >= STAMINA_RECOVER) p.exhausted = false;
  }
  if (p.exhausted && Math.random() < dt * 3) {
    particles.push({ x: p.x + p.w / 2 + p.facing * 6, y: p.y + 2, vx: p.facing * 12, vy: -30, life: 0.5, max: 0.5, color: '#9ad8ff', size: 2, grav: 200 });
  }

  if (p.onGround && Math.abs(p.vx) > 40) {
    p.stepT += dt * Math.abs(p.vx) / WALK_MAX;
    if (p.stepT > 0.3) { p.stepT = 0; dust(p.x + p.w / 2 - p.facing * 4, p.y + p.h, sprinting ? 3 : 1); if (sprinting) sfx.step(); }
  }

  if (p.hurtT > 0) p.anim = 'hurt';
  else if (p.attacking) p.anim = 'attack';
  else if (!p.onGround) p.anim = p.vy < 0 ? 'jump' : 'fall';
  else if (p.crouching) p.anim = 'crouch';
  else if (sprinting) p.anim = 'sprint';
  else if (Math.abs(p.vx) > 10) p.anim = 'run';
  else p.anim = p.exhausted ? 'pant' : 'idle';
}

function attackBox() {
  const p = player;
  if (!p.attacking || p.attackT < 0.12 || p.attackT > 0.25) return null;
  const reach = reachFor(p.tier);
  const y = p.crouching ? p.y + 4 : p.y + 10;
  return p.facing > 0 ? { x: p.x + p.w, y, w: reach, h: 14 } : { x: p.x - reach, y, w: reach, h: 14 };
}

/* ------------------------------------------------------------------ */
/* Update: enemies, barrels, items                                     */
/* ------------------------------------------------------------------ */
function defeatEnemy(e, how) {
  e.dead = true; e.state = 'dead'; e.t = 0;
  e.spawn.alive = false;
  G.kills++;
  addScore(100, e.x + e.w / 2, e.y - 4);
  if (how === 'stomp') { e.ko = 'flat'; e.vy = 0; e.vx = 0; sfx.stomp(); G.hitstop = 0.06; }
  else { e.ko = 'down'; e.vy = -170; e.vx = player.facing * 95; e.facing = -player.facing; sfx.hit(); cam.shake = 0.1; G.hitstop = 0.08; }
  burst(e.x + e.w / 2, e.y + 14, 10, ['#ffffff', '#ffe08a', '#ffb347'], 90, 300, 0.45);
  level.items.push({ type: 'coin', x: e.x + e.w / 2, y: e.y + 10, taken: false, t: 0, vy: -200, vx: (Math.random() - 0.5) * 40, loose: true });
}
function updateEnemies(dt) {
  const p = player;
  const pcx = p.x + p.w / 2, pcy = p.y + p.h / 2;
  const abox = attackBox();
  for (const e of enemies) {
    e.animT += dt;
    if (e.dead) {
      e.t += dt;
      const vanishAt = e.ko === 'flat' ? 0.5 : 1.15;
      if (e.ko !== 'flat') {
        e.vy = Math.min(e.vy + GRAV * dt, MAX_FALL);
        moveX(e, e.vx * dt); moveY(e, e.vy * dt);
        if (e.onGround) e.vx *= 0.82;
        e.rot = Math.min(Math.PI / 2, e.rot + dt * 7);
      }
      if (e.t > vanishAt && !e.gone) {
        e.gone = true;
        burst(e.x + e.w / 2, e.y + e.h - 6, 12, ['#e8e0d0', '#c8beb0', '#ffffff'], 50, -40, 0.6, 3);
      }
      continue;
    }
    if (!e.active) { if (e.x < cam.x + W + 48 && e.x > cam.x - 48) e.active = true; else continue; }
    const ecx = e.x + e.w / 2, dx = pcx - ecx, dy = pcy - (e.y + e.h / 2);
    e.t += dt;
    const canSee = !p.dead && Math.abs(dx) < 80 && Math.abs(dy) < 30 && G.clearT < 0;
    switch (e.state) {
      case 'patrol':
        e.vx = e.facing * 22;
        if (e.onGround && (!groundAhead(e, e.facing) || e.hitWall || touchesFire({ x: e.x + e.facing * 10, y: e.y, w: e.w, h: e.h }) !== null)) { e.facing *= -1; e.vx = e.facing * 22; }
        if (canSee) { e.state = 'notice'; e.t = 0; e.facing = Math.sign(dx) || e.facing; sfx.notice(); }
        break;
      case 'notice':
        e.vx = 0;
        if (e.t > 0.5) { e.state = 'chase'; e.t = 0; }
        break;
      case 'chase':
        e.facing = Math.sign(dx) || e.facing;
        e.vx = e.facing * 40;
        if (e.onGround && (!groundAhead(e, e.facing) || touchesFire({ x: e.x + e.facing * 10, y: e.y, w: e.w, h: e.h }) !== null)) e.vx = 0;
        if (Math.abs(dx) < 26 && Math.abs(dy) < 20 && !p.dead) { e.state = 'windup'; e.t = 0; e.vx = 0; }
        if (Math.abs(dx) > 140 || p.dead) { e.state = 'patrol'; e.t = 0; }
        break;
      case 'windup':
        e.vx = 0;
        if (e.t > 0.45) { e.state = 'slash'; e.t = 0; sfx.swing(); }
        break;
      case 'slash': {
        e.vx = e.facing * 18;
        const hb = e.facing > 0 ? { x: e.x + e.w, y: e.y + 10, w: 16, h: 14 } : { x: e.x - 16, y: e.y + 10, w: 16, h: 14 };
        if (overlap(hb, p) && !p.dead) hurtPlayer(ecx);
        if (e.t > 0.18) { e.state = 'recover'; e.t = 0; }
        break;
      }
      case 'recover':
        e.vx = 0;
        if (e.t > 0.65) { e.state = 'chase'; e.t = 0; }
        break;
    }
    e.vy = Math.min(e.vy + GRAV * dt, MAX_FALL);
    moveX(e, e.vx * dt);
    moveY(e, e.vy * dt);
    if (e.y > LEVEL_H + 40) { e.dead = true; e.spawn.alive = false; continue; }
    if (abox && overlap(abox, e) && !p.hitSet.has(e)) { p.hitSet.add(e); defeatEnemy(e, 'hit'); continue; }
    if (!p.dead && overlap(p, e)) {
      if (p.vy > 40 && p.y + p.h - e.y < 14) {
        defeatEnemy(e, 'stomp');
        p.vy = keys.jump ? -380 : -260; p.jumping = keys.jump; p.y = e.y - p.h;
      } else hurtPlayer(ecx);
    }
  }
  enemies = enemies.filter(e => !(e.dead && (e.y > LEVEL_H + 60 || (e.gone && e.t > 1.5))));
}
function updateBarrels(dt) {
  const p = player;
  for (const s of level.spawners) {
    const onScreen = s.x < cam.x + W + 24 && s.x > cam.x - 16;
    if (onScreen && p.x < s.x - 24 && !p.dead && G.clearT < 0) {
      s.timer -= dt;
      if (s.timer <= 0) { s.timer = 3.0; barrels.push({ x: s.x - 4, y: s.y, w: 14, h: 14, vx: -55, vy: 0, rot: 0, onGround: false }); }
    }
  }
  const abox = attackBox();
  for (const b of barrels) {
    b.vy = Math.min(b.vy + GRAV * dt, MAX_FALL);
    moveX(b, b.vx * dt);
    moveY(b, b.vy * dt);
    b.rot += b.vx * dt / 7;
    if (b.hitWall) b.broken = true;
    if (b.y > LEVEL_H + 30 || b.x < cam.x - 64) b.gone = true;
    if (b.broken || b.gone) continue;
    if (abox && overlap(abox, b)) { b.broken = true; addScore(50, b.x + 7, b.y - 4); sfx.smash(); G.hitstop = 0.04; }
    else if (!p.dead && overlap(p, b)) {
      if (p.vy > 40 && p.y + p.h - b.y < 10) {
        b.broken = true; addScore(50, b.x + 7, b.y - 4); sfx.smash();
        p.vy = keys.jump ? -380 : -260; p.jumping = keys.jump;
      } else hurtPlayer(b.x + 7);
    }
    if (b.broken) burst(b.x + 7, b.y + 7, 12, ['#a8743c', '#6e4a24', '#c08850'], 110, 500, 0.7, 2);
  }
  barrels = barrels.filter(b => !b.broken && !b.gone);
}
function updateItems(dt) {
  const p = player;
  for (const it of level.items) {
    it.t += dt;
    if (it.taken) continue;
    if (it.loose) {
      it.vy = Math.min((it.vy || 0) + GRAV * 0.8 * dt, 300);
      it.y += it.vy * dt; it.x += (it.vx || 0) * dt;
      const r = Math.floor((it.y + 5) / TS), c = Math.floor(it.x / TS);
      if (isSolidT(getT(c, r)) || isOneWayAt(c, r, { climbing: false })) { it.y = r * TS - 5; it.vy = 0; it.vx = 0; }
      if (it.y > LEVEL_H + 20) it.taken = true;
      if (it.t < 0.3) continue;
    }
    if (p.dead) continue;
    const box = it.type === 'chest' ? { x: it.x - 9, y: it.y - 12, w: 18, h: 12 } : { x: it.x - 6, y: it.y - 6, w: 12, h: 12 };
    if (!overlap(p, box)) continue;
    switch (it.type) {
      case 'coin': it.taken = true; addCoin(it.x, it.y); burst(it.x, it.y, 5, ['#fff2a8', '#f2c84b'], 50, 0, 0.3, 1); break;
      case 'gem': it.taken = true; addScore(1000, it.x, it.y); sfx.gem(); burst(it.x, it.y, 10, ['#9fc8ff', '#3f7fe8', '#ffffff'], 70, 0, 0.5, 1); break;
      case 'shard':
        it.taken = true; G.shards++; addScore(1000, it.x, it.y); sfx.shard();
        burst(it.x, it.y, 26, ['#7fe0ff', '#ffffff', '#ffb347'], 90, 0, 0.9, 2);
        toast('EMBER SHARD FOUND!', "A PIECE OF THE DRAGON'S HEART  (1 OF 14)");
        break;
      case 'potion':
        it.taken = true;
        if (p.tier < G.maxTier) { setTier(p.tier + 1); toast('ARMOR MENDED', TIERS[p.tier].name); }
        else addScore(500, it.x, it.y);
        sfx.potion(); burst(it.x, it.y, 14, ['#ff6a7a', '#ffd0d8', '#ffffff'], 70, 0, 0.6);
        break;
      case 'chest':
        if (!it.open) {
          it.open = true; it.openT = 0;
          setTier(p.tier + 1);
          sfx.chest();
          burst(it.x, it.y - 8, 22, ['#ffe08a', '#ffffff', '#e2b23c'], 100, 150, 0.8, 2);
          toast(TIERS[p.tier].name + '!', 'YOUR ARMOR NOW ABSORBS A HIT');
        }
        break;
    }
  }
}
function touchesFire(o) {
  const c0 = Math.floor(o.x / TS), c1 = Math.floor((o.x + o.w - 1) / TS);
  const r0 = Math.floor(o.y / TS), r1 = Math.floor((o.y + o.h - 1) / TS);
  for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) if (getT(c, r) === T.FIRE) return c * TS + 8;
  return null;
}
function updateWorldObjects(dt) {
  const p = player;
  if (p.dead) return;
  const fx = touchesFire({ x: p.x + 2, y: p.y + 6, w: p.w - 4, h: p.h - 6 });
  if (fx !== null) hurtPlayer(fx);
  const cp = level.checkpoint;
  if (!cp.active && Math.abs((p.x + p.w / 2) - cp.x) < 10 && p.y + p.h > GY - 4) {
    cp.active = true;
    G.respawn = { x: cp.x - 7, y: GY - 38 };
    sfx.check();
    popups.push({ x: cp.x, y: cp.y - 52, text: 'CHECKPOINT', t: 0, color: '#9fd0ff' });
  }
  const ws = level.waystone;
  if (!ws.active && Math.abs((p.x + p.w / 2) - ws.x) < 12 && p.y + p.h > GY - 4) {
    ws.active = true; G.clearT = 0;
    Sound.stop(); sfx.clear();
    const bonus = G.shards * 1000 + p.tier * 500;
    if (bonus) addScore(bonus, ws.x, ws.y - 56);
  }
  const hb = level.hobb;
  hb.near = Math.abs((p.x + p.w / 2) - hb.x) < 28 && Math.abs(p.y + p.h - hb.y) < 20;
  if (hb.near && pressed.up && !p.climbing && G.introT <= 0) talkToHobb();
}
function updateParticles(dt) {
  for (const q of particles) { q.life -= dt; q.vy += q.grav * dt; q.x += q.vx * dt; q.y += q.vy * dt; }
  particles = particles.filter(q => q.life > 0);
  for (const pp of popups) pp.t += dt;
  popups = popups.filter(pp => pp.t < 1.1);
  for (const [c, v] of hayBounce) { if (v - dt <= 0) hayBounce.delete(c); else hayBounce.set(c, v - dt); }
}
function updateCamera(dt) {
  const p = player;
  if (!p.dead) {
    const tx = p.x + p.w / 2 - W * 0.42 + p.facing * 24;
    cam.x += (tx - cam.x) * Math.min(1, dt * 3.5);
    const ty = p.y + p.h / 2 - H * 0.68;
    cam.y += (ty - cam.y) * Math.min(1, dt * 3);
  }
  cam.x = clamp(cam.x, 0, LEVEL_W - W);
  cam.y = clamp(cam.y, 0, LEVEL_H - H);
  if (cam.shake > 0) cam.shake -= dt;
}

function drawCottage(x, gy, d, t, i) {
  const burn = !!d.burn;
  // foundation
  px(ctx, x + 2, gy - 7, 76, 7, '#6e6a64');
  for (let k = 0; k < 8; k++) { px(ctx, x + 3 + k * 9 + (k % 2) * 2, gy - 6, 8, 3, '#8a857e'); px(ctx, x + 3 + k * 9 + (k % 2) * 2, gy - 6, 8, 1, '#a8a39b'); }
  // walls

function drawBanner() {
  if (G.banner <= 0) return;
  ctx.globalAlpha = Math.max(0, Math.min(1, G.banner, (3 - G.banner) * 3));
  px(ctx, 0, 88, W, 48, 'rgba(10,8,6,0.75)');
  drawText('ACT 1-1', W / 2, 94, '#ffe08a', 2, 'center', '#000000');
  drawText('BURNING FARMS', W / 2, 114, '#ffffff', 2, 'center', '#000000');
  ctx.globalAlpha = 1;
}

/* ------------------------------------------------------------------ */
/* Title, prologue, game over, summary                                 */
/* ------------------------------------------------------------------ */
const PROLOGUE = [
  'THE VALLEY OF HOLLOWMERE HAD NOT SEEN RAIN IN THREE SUMMERS.',
  'THEN THE MOUNTAIN WOKE. RED LIGHT IN THE NORTH. ASH ON THE WIND.',
  'BANDITS CAME DOWN FROM THE HILLS, RUNNING FROM SOMETHING WORSE, AND TOOK WHATEVER THEY FOUND.',
  'TAM HAD NEVER FOUGHT ANYTHING BIGGER THAN A GOOSE.'
];
const pro = { i: 0, chars: 0, t: 0 };
function drawProloguePanel(i, t) {
  if (i === 0) {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#e8a050'); g.addColorStop(0.7, '#f5d08a'); g.addColorStop(1, '#f0b060');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    disc(ctx, 340, 70, 30, 'rgba(255,250,200,0.35)'); disc(ctx, 340, 70, 22, '#fff4c0');
    px(ctx, 0, 170, W, 100, '#b08a50'); px(ctx, 0, 170, W, 2, '#9a7440');
    const r = rng(9);
    for (let k = 0; k < 26; k++) { const x = r() * W, y = 176 + r() * 80; line(ctx, x, y, x + 10 + r() * 20, y + (r() - 0.5) * 8, '#8a6a3a', 1); }
    for (let k = 0; k < 30; k++) { const x = (k * 37) % W, y = 172 + (k * 13) % 12; px(ctx, x, y - 8, 1, 8, '#8a6a3a'); px(ctx, x - 2, y - 8, 2, 1, '#8a6a3a'); }
  } else if (i === 1) {
    drawBackdrop(4600, CAM_SURF, t, 0.55);
    const sx = VOLC_X - (4600 * 0.1) % 960, pulse = 0.5 + 0.5 * Math.sin(t * 3);
    ctx.fillStyle = `rgba(255,70,30,${(0.25 + 0.3 * pulse).toFixed(3)})`; ctx.fillRect(Math.round(sx - 40), VOLC_TOP - 30, 80, 40);
    for (let k = 0; k < 30; k++) px(ctx, (k * 53 + t * 20) % W, ((k * 29 - t * 15) % H + H) % H, 1, 1, '#ff8a4a');
  } else if (i === 2) {
    drawBackdrop(900, CAM_SURF, t, 0.5);
    px(ctx, 0, 222, W, 48, '#2e4a2a');
    [10, 170, 330].forEach((x, k) => drawCottage(x, 222, { burn: true }, t, k));
    for (let k = 0; k < 3; k++) {
      const x = ((t * 45 + k * 150) % (W + 60)) - 30, f = Math.floor((t + k) * 9) % 6;
      blit(getSprite(LOOKS.bandit, 'chase' + f, banditPose('chase', f)), x, 224, 1);
      drawFlame(x + 10, 196, 4, t, k);
    }
    ctx.fillStyle = 'rgba(255,90,30,0.12)'; ctx.fillRect(0, 0, W, H);
  } else {
    px(ctx, 0, 0, W, H, '#3a2618');
    for (let x = 0; x < W; x += 20) { px(ctx, x, 0, 18, 200, '#5a3a22'); px(ctx, x, 0, 2, 200, '#4a2e1a'); }
    px(ctx, 0, 200, W, 70, '#6e4a2a');
    for (let k = 0; k < 6; k++) { const x = 30 + k * 18; px(ctx, x, 186, 26, 14, '#d8b860'); px(ctx, x + 2, 186, 22, 2, '#f0d675'); }
    ctx.fillStyle = 'rgba(255,220,140,0.15)'; ctx.beginPath(); ctx.moveTo(300, 0); ctx.lineTo(360, 0); ctx.lineTo(420, 200); ctx.lineTo(260, 200); ctx.fill();
    blit(heroSprite(0, 'idle', Math.floor(t * 2) % 4), 220, 200, 1, 0, 1, 2);
    px(ctx, 318, 80, 3, 120, '#8a5a2c'); px(ctx, 318, 80, 1, 120, '#c08850');
    px(ctx, 310, 80, 19, 3, '#aab3bc'); px(ctx, 310, 64, 3, 16, '#aab3bc'); px(ctx, 318, 60, 3, 20, '#e6ebef'); px(ctx, 326, 64, 3, 16, '#aab3bc');
  }
}
function updatePrologue(dt) {
  pro.t += dt;
  const text = PROLOGUE[pro.i];
  const before = Math.floor(pro.chars);
  pro.chars = Math.min(text.length, pro.chars + 32 * dt);
  if (Math.floor(pro.chars) !== before && Math.floor(pro.chars) % 3 === 0) sfx.blip();
  if (anyAdvance()) {
    if (pro.chars < text.length) pro.chars = text.length;
    else { pro.i++; pro.chars = 0; pro.t = 0; if (pro.i >= PROLOGUE.length) startPlay(); }
  }
}
function drawPrologue() {
  drawProloguePanel(pro.i, globalT);
  px(ctx, 0, 0, W, 14, '#000'); px(ctx, 0, H - 52, W, 52, '#000');
  const lines = wrapText(PROLOGUE[pro.i], 60);
  const shown = Math.floor(pro.chars);
  let used = 0;
  lines.forEach((l, k) => {
    const part = PROLOGUE[pro.i].slice(used, used + l.length).slice(0, Math.max(0, shown - used));
    used += l.length + 1;
    drawText(part, W / 2 - textWidth(l) / 2, H - 42 + k * 12, '#f5e6c8');
  });
  if (pro.chars >= PROLOGUE[pro.i].length && Math.floor(globalT * 2.5) % 2 === 0) drawText('ENTER', W - 10, H - 12, '#ffe08a', 1, 'right');
  drawText((pro.i + 1) + '/4', 10, H - 12, '#7a6a5a');
}
function startPlay() { newGame(); state = 'play'; Sound.play(); }
function drawTitle() {
  const cx = globalT * 14;
  drawBackdrop(cx, CAM_SURF, globalT);
  px(ctx, 0, 222, W, 48, '#7a4e2c');
  for (let x = 0; x < W; x += 16) { ctx.drawImage(TILE.grass[(x / 16) % 4], x, 222); ctx.drawImage(TILE.tufts[(x / 16 + 1) % 4], x, 215); ctx.drawImage(TILE.dirt[(x / 16 + 2) % 4], x, 238); ctx.drawImage(TILE.dirt[(x / 16 + 3) % 4], x, 254); }
  drawCottage(16, 222, { burn: true }, globalT, 1);
  drawCottage(384, 222, { burn: false, shop: true }, globalT, 2);
  blit(heroSprite(0, 'idle', Math.floor(globalT * 3) % 4), 170, 222, 1);
  for (let k = 1; k <= 4; k++) blit(heroSprite(k, 'idle', 0), 170 + k * 36, 222, -1, 0, 0.45 + k * 0.12);
  px(ctx, 0, 26, W, 74, 'rgba(10,8,6,0.6)');
  drawText('PEASANT TO', W / 2, 34, '#f5e6c8', 3, 'center', '#3a1a0a');
  drawText('DRAGON SLAYER', W / 2, 62, '#ffb347', 4, 'center', '#5a1a0a');
  drawText('ACT 1-1 PLAYABLE PROTOTYPE', W / 2, 106, '#ffffff', 1, 'center', '#000000');
  if (Math.floor(globalT * 2) % 2 === 0) drawText('PRESS ENTER', W / 2, 122, '#ffe08a', 2, 'center', '#000000');
  px(ctx, 0, 240, W, 30, 'rgba(10,8,6,0.7)');
  drawText('ARROWS WALK  SHIFT RUN  Z JUMP  X JAB  DOWN CROUCH  UP CLIMB/TALK', W / 2, 245, '#d8c8a8', 1, 'center');
  drawText('P PAUSE   M MUTE   GAMEPAD SUPPORTED' + (best ? '   BEST ' + best : ''), W / 2, 257, '#a89878', 1, 'center');
}
function drawPause() {
  px(ctx, 0, 0, W, H, 'rgba(0,0,0,0.6)');
  drawText('PAUSED', W / 2, 70, '#ffe08a', 3, 'center', '#000');
  ['ARROWS / WASD  WALK      SHIFT / C  RUN (USES STAMINA)', 'Z / SPACE  JUMP (HOLD FOR HIGHER)', 'X  JAB WITH YOUR WEAPON', 'DOWN  CROUCH        UP  CLIMB / TALK',
   'LAND ON ENEMIES TO STOMP THEM', 'ARMOR IS YOUR HEALTH: EACH HIT COSTS ONE TIER', 'M  MUTE ' + (Sound.muted ? '(MUTED)' : ''), 'P  RESUME']
    .forEach((l, k) => drawText(l, W / 2, 110 + k * 13, '#ffffff', 1, 'center'));
}
function drawGameOver() {
  px(ctx, 0, 0, W, H, 'rgba(0,0,0,0.75)');
  drawText('GAME OVER', W / 2, 100, '#ff6a4a', 4, 'center', '#000');
  drawText('SCORE ' + G.score, W / 2, 140, '#ffffff', 1, 'center');
  if (Math.floor(globalT * 2) % 2 === 0) drawText('ENTER: TRY ACT 1-1 AGAIN', W / 2, 164, '#ffe08a', 1, 'center');
}
function drawSummary() {
  drawBackdrop(cam.x, CAM_SURF, globalT, 0.35);
  px(ctx, 60, 30, W - 120, 210, 'rgba(10,8,6,0.85)');
  px(ctx, 60, 30, W - 120, 2, '#c9a86a'); px(ctx, 60, 238, W - 120, 2, '#c9a86a');
  drawText('ACT 1-1 CLEAR!', W / 2, 44, '#ffe08a', 3, 'center', '#000');
  const mins = Math.floor(G.time / 60), secs = Math.floor(G.time % 60);
  [['SCORE', String(G.score)], ['COINS', String(G.coins)], ['EMBER SHARD', G.shards ? 'FOUND' : 'MISSED'],
   ['BANDITS DEFEATED', String(G.kills)], ['ARMOR AT THE END', TIERS[player.tier].name],
   ['TIME', mins + ':' + String(secs).padStart(2, '0')], ['LIVES LOST', String(G.deaths)]].forEach((r, k) => {
    drawText(r[0], 90, 80 + k * 14, '#d8c8a8');
    drawText(r[1], W - 90, 80 + k * 14, r[0] === 'EMBER SHARD' && G.shards ? '#c8f4ff' : '#ffffff', 1, 'right');
  });
  if (G.score >= best) drawText('NEW BEST!', W / 2, 184, '#8fff8f', 1, 'center');
  drawText('NEXT: 1-2 WINDMILL HILL (COMING SOON)', W / 2, 200, '#a89878', 1, 'center');
  if (Math.floor(globalT * 2) % 2 === 0) drawText('ENTER: PLAY AGAIN', W / 2, 220, '#ffe08a', 1, 'center');
}

/* ------------------------------------------------------------------ */
/* Main update / render                                                */
/* ------------------------------------------------------------------ */
function update(dt) {
  globalT += dt;
  if (pressed.mute) Sound.toggleMute();
  switch (state) {
    case 'title':
      if (pressed.start || pressed.jump) { sfx.select(); state = 'prologue'; pro.i = 0; pro.chars = 0; pro.t = 0; }
      break;
    case 'prologue': updatePrologue(dt); break;
    case 'play': updatePlay(dt); break;
    case 'gameover':
      G.overT += dt;
      if (G.overT > 0.8 && (pressed.start || pressed.jump)) { sfx.select(); startPlay(); }
      break;
    case 'summary':
      if (pressed.start || pressed.jump) { sfx.select(); state = 'title'; }
      break;
  }
}
function updatePlay(dt) {
  if (pressed.pause && !dlg.active) G.paused = !G.paused;
  if (G.paused) return;
  if (G.hitstop > 0) { G.hitstop -= dt; return; }
  if (G.coinPop > 0) G.coinPop -= dt;
  if (G.banner > 0) G.banner -= dt;
  if (dlg.active) { updateDialogue(dt); return; }
  if (G.introT > 0) {
    G.introT -= dt;
    if (G.introT <= 0 && !level.hobb.talked) { level.hobb.talked = true; say(HOBB_INTRO); }
  }
  if (G.clearT < 0) G.time += dt;
  updatePlayer(dt);
  if (state !== 'play') return;
  updateEnemies(dt);
  updateBarrels(dt);
  updateItems(dt);
  updateWorldObjects(dt);
  updateParticles(dt);
  updateCritters(dt);
  updateCamera(dt);
  if (G.clearT >= 0) {
    G.clearT += dt;
    if (G.clearT > 2.6) {
      state = 'summary';
      if (G.score > best) { best = G.score; try { localStorage.setItem('p2ds-best', String(best)); } catch (e) { /* storage unavailable */ } }
    }
  }
}
function renderPlay() {
  const shakeX = cam.shake > 0 ? Math.round((Math.random() - 0.5) * 4) : 0;
  const shakeY = cam.shake > 0 ? Math.round((Math.random() - 0.5) * 4) : 0;
  drawBackdrop(cam.x, cam.y, globalT);
  drawBirds(globalT);
  ctx.save();
  ctx.translate(-Math.round(cam.x) + shakeX, -Math.round(cam.y) + shakeY);
  drawDecor(globalT);
  drawTiles();
  drawTorches(globalT);
  drawCheckpoint(globalT);
  drawWaystone(globalT);
  drawItems(globalT);
  drawHobb(globalT);
  drawCritters(globalT);
  drawEnemies();
  drawPlayer();
  drawParticles();
  ctx.restore();
  drawHUD();
  drawBanner();
  drawToast();
  if (G.clearT >= 0) {
    ctx.globalAlpha = Math.min(1, G.clearT / 0.6);
    px(ctx, 0, 100, W, 40, 'rgba(10,8,6,0.7)');
    drawText('THE WAYSTONE GLOWS', W / 2, 106, '#c8f4ff', 2, 'center', '#000');
    drawText('THE ROAD TO WINDMILL HILL IS OPEN', W / 2, 126, '#ffffff', 1, 'center');
    ctx.globalAlpha = 1;
  }
  if (dlg.active) drawDialogue();
  if (G.paused) drawPause();
}
function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  switch (state) {
    case 'title': drawTitle(); break;
    case 'prologue': drawPrologue(); break;
    case 'play': renderPlay(); break;
    case 'gameover': renderPlay(); drawGameOver(); break;
    case 'summary': drawSummary(); break;
  }
}

buildTiles();
buildBackgrounds();
let last = performance.now(), acc = 0;
const STEP = 1 / 60;
function frame(now) {
  acc += Math.min(0.1, (now - last) / 1000);
  last = now;
  while (acc >= STEP) { pollPad(); update(STEP); clearPressed(); acc -= STEP; }
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
